name: Site monitor

# Read-only checks against the live site. A failed run emails the repository
# owner through GitHub's own Actions notifications, so no mail credentials live
# in the repo. Runs hourly; GitHub may start scheduled runs a few minutes late.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check emailsignaturegenerator.ai
        run: npm run monitor
