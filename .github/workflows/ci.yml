name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Site contract and Worker behaviour
        run: npm run check
      - name: Generated pages up to date
        run: node generate-pages.js --check
      - name: Frontend accessibility and tool scripts
        run: |
          npm run test:frontend
          node tests/health-check.test.js
          node tests/brand-tool.test.js
          node tests/connect-agent.test.js
          node tests/bulk-ui.test.js
      - name: Live-site monitor, funnel, Search Console, and automation scripts
        run: |
          npm run test:monitor
          npm run test:funnel
          node tests/export-search-console.test.js
          npm run test:automation
      - name: Media encoders and animations
        run: node tests/media-encoders.test.js
      - name: Brand from website
        run: npm run test:brand
      - name: Team pack
        run: npm run test:team
      - name: Paid bulk and agent connections
        run: |
          npm run test:bulk
          npm run test:agents
      - name: Builder checkout recovery and paywall
        run: npm run test:builder
      - name: Signature template output
        run: npm run test:templates
      - name: Worker payment and input hardening
        run: |
          npm run test:worker
          npm run test:purchase-email
