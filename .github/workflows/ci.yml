name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Site contract and Worker behaviour
        run: npm run check
      - name: Frontend accessibility regressions
        run: npm run test:frontend
      - name: Live-site monitor logic
        run: npm run test:monitor
