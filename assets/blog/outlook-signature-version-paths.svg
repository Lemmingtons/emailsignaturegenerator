<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Outlook email signature paths by version</title>
  <desc id="desc">Four cards show the signature settings paths for new Outlook and web, classic Outlook for Windows, Outlook for Mac, and the separate mobile app.</desc>
  <rect width="1200" height="700" rx="30" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="72" fill="#0f172a" font-size="34" font-weight="700">First identify the Outlook version</text>
    <text x="64" y="108" fill="#475569" font-size="19">A mismatched screen usually means the instructions belong to another Outlook surface.</text>
    <rect x="64" y="154" width="520" height="202" rx="22" fill="#ecfeff" stroke="#67e8f9"/>
    <rect x="616" y="154" width="520" height="202" rx="22" fill="#eff6ff" stroke="#93c5fd"/>
    <rect x="64" y="386" width="520" height="202" rx="22" fill="#f5f3ff" stroke="#c4b5fd"/>
    <rect x="616" y="386" width="520" height="202" rx="22" fill="#fff7ed" stroke="#fdba74"/>
    <circle cx="116" cy="208" r="28" fill="#0891b2"/><text x="116" y="218" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">1</text>
    <text x="160" y="202" fill="#155e75" font-size="22" font-weight="700">NEW OUTLOOK + WEB</text>
    <text x="160" y="236" fill="#334155" font-size="18">Settings → Accounts → Signatures</text>
    <text x="160" y="273" fill="#64748b" font-size="16">Choose account → Add signature → defaults → Save</text>
    <text x="160" y="306" fill="#64748b" font-size="16">Use Insert → Signature when composing manually.</text>
    <circle cx="668" cy="208" r="28" fill="#2563eb"/><text x="668" y="218" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">2</text>
    <text x="712" y="202" fill="#1d4ed8" font-size="22" font-weight="700">CLASSIC OUTLOOK</text>
    <text x="712" y="236" fill="#334155" font-size="18">File → Options → Mail → Signatures</text>
    <text x="712" y="273" fill="#64748b" font-size="16">New → paste or type → account defaults → OK</text>
    <text x="712" y="306" fill="#64748b" font-size="16">Use this path when new-Outlook Settings do not match.</text>
    <circle cx="116" cy="440" r="28" fill="#7c3aed"/><text x="116" y="450" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">3</text>
    <text x="160" y="434" fill="#6d28d9" font-size="22" font-weight="700">OUTLOOK FOR MAC</text>
    <text x="160" y="468" fill="#334155" font-size="18">Outlook → Settings → Signatures</text>
    <text x="160" y="505" fill="#64748b" font-size="16">Add or rename → edit → close → per-account defaults</text>
    <text x="160" y="538" fill="#64748b" font-size="16">Check Microsoft’s page for legacy-screen changes.</text>
    <circle cx="668" cy="440" r="28" fill="#ea580c"/><text x="668" y="450" text-anchor="middle" fill="#fff" font-size="27" font-weight="700">4</text>
    <text x="712" y="434" fill="#c2410c" font-size="22" font-weight="700">OUTLOOK MOBILE</text>
    <text x="712" y="468" fill="#334155" font-size="18">App Settings → Signature</text>
    <text x="712" y="505" fill="#64748b" font-size="16">Treat it as a separate signature surface.</text>
    <text x="712" y="538" fill="#64748b" font-size="16">Use text-first content unless richer output is tested.</text>
    <rect x="214" y="620" width="772" height="48" rx="24" fill="#dcfce7" stroke="#86efac"/>
    <text x="600" y="651" text-anchor="middle" fill="#166534" font-size="18" font-weight="700">Every path ends with the same proof: save, send, open, and click.</text>
  </g>
</svg>
