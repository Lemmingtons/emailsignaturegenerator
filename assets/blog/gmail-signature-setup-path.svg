<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Gmail desktop email signature setup path</title>
  <desc id="desc">Five steps from Gmail Settings and the Signature section through signature defaults, Save Changes, and a received-message test, with a separate note for mobile signatures.</desc>
  <rect width="1200" height="650" rx="30" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="72" fill="#0f172a" font-size="34" font-weight="700">Gmail desktop: five checkpoints</text>
    <text x="64" y="108" fill="#475569" font-size="19">The official labels are simple. The received-message test is still the decisive check.</text>
    <path d="M130 300H1070" stroke="#bae6fd" stroke-width="8" stroke-linecap="round"/>
    <g transform="translate(34 164)"><rect width="200" height="270" rx="20" fill="#fff" stroke="#cbd5e1"/><circle cx="100" cy="64" r="30" fill="#0891b2"/><text x="100" y="74" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">1</text><text x="100" y="126" text-anchor="middle" fill="#164e63" font-size="18" font-weight="700">SETTINGS</text><text x="100" y="159" text-anchor="middle" fill="#334155" font-size="15">Settings gear</text><text x="100" y="183" text-anchor="middle" fill="#334155" font-size="15">See all settings</text><text x="100" y="225" text-anchor="middle" fill="#64748b" font-size="14">Desktop browser</text></g>
    <g transform="translate(267 164)"><rect width="200" height="270" rx="20" fill="#fff" stroke="#cbd5e1"/><circle cx="100" cy="64" r="30" fill="#0891b2"/><text x="100" y="74" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">2</text><text x="100" y="126" text-anchor="middle" fill="#164e63" font-size="18" font-weight="700">SIGNATURE</text><text x="100" y="159" text-anchor="middle" fill="#334155" font-size="15">General tab</text><text x="100" y="183" text-anchor="middle" fill="#334155" font-size="15">Find Signature</text><text x="100" y="225" text-anchor="middle" fill="#64748b" font-size="14">Create or select</text></g>
    <g transform="translate(500 164)"><rect width="200" height="270" rx="20" fill="#fff" stroke="#cbd5e1"/><circle cx="100" cy="64" r="30" fill="#0891b2"/><text x="100" y="74" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">3</text><text x="100" y="126" text-anchor="middle" fill="#164e63" font-size="18" font-weight="700">ADD + DEFAULTS</text><text x="100" y="159" text-anchor="middle" fill="#334155" font-size="15">Type or paste</text><text x="100" y="183" text-anchor="middle" fill="#334155" font-size="15">New + replies</text><text x="100" y="225" text-anchor="middle" fill="#64748b" font-size="14">Per sender address</text></g>
    <g transform="translate(733 164)"><rect width="200" height="270" rx="20" fill="#fff" stroke="#cbd5e1"/><circle cx="100" cy="64" r="30" fill="#0891b2"/><text x="100" y="74" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">4</text><text x="100" y="126" text-anchor="middle" fill="#164e63" font-size="18" font-weight="700">SAVE CHANGES</text><text x="100" y="159" text-anchor="middle" fill="#334155" font-size="15">Scroll to the bottom</text><text x="100" y="183" text-anchor="middle" fill="#334155" font-size="15">Save Changes</text><text x="100" y="225" text-anchor="middle" fill="#64748b" font-size="14">Then compose</text></g>
    <g transform="translate(966 164)"><rect width="200" height="270" rx="20" fill="#ecfeff" stroke="#67e8f9"/><circle cx="100" cy="64" r="30" fill="#22c55e"/><text x="100" y="74" text-anchor="middle" fill="#fff" font-size="28" font-weight="700">5</text><text x="100" y="126" text-anchor="middle" fill="#155e75" font-size="18" font-weight="700">RECEIVED TEST</text><text x="100" y="159" text-anchor="middle" fill="#334155" font-size="15">Send and open</text><text x="100" y="183" text-anchor="middle" fill="#334155" font-size="15">Click every link</text><text x="100" y="225" text-anchor="middle" fill="#64748b" font-size="14">Desktop + mobile</text></g>
    <rect x="160" y="492" width="880" height="104" rx="18" fill="#fff7ed" stroke="#fdba74"/>
    <text x="196" y="530" fill="#c2410c" font-size="18" font-weight="700">MOBILE IS SEPARATE</text>
    <text x="196" y="562" fill="#334155" font-size="17">Android: account Settings → Mobile signature. iPhone/iPad: Settings → Signature settings.</text>
    <text x="196" y="586" fill="#64748b" font-size="15">If no app signature is set, Google says new mobile messages use the computer signature.</text>
  </g>
</svg>
