<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Comparison of standard and social-first email signature icon sizes</title>
  <desc id="desc">A side-by-side comparison showing standard 22 pixel social icons with eight pixel spacing and social-first 30 pixel icons with ten pixel spacing.</desc>
  <rect width="1200" height="620" rx="32" fill="#f8fafc"/>
  <text x="70" y="70" fill="#164e63" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">Choose size by hierarchy—not decoration</text>
  <text x="70" y="106" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="18">Both examples are enlarged 3× so the difference is easy to inspect.</text>

  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="70" y="150" width="500" height="390" rx="22" fill="#ffffff" stroke="#cbd5e1"/>
    <rect x="630" y="150" width="500" height="390" rx="22" fill="#ffffff" stroke="#cbd5e1"/>

    <rect x="100" y="180" width="118" height="30" rx="15" fill="#ecfeff"/>
    <text x="159" y="201" text-anchor="middle" fill="#0e7490" font-size="14" font-weight="700">STANDARD</text>
    <text x="100" y="247" fill="#164e63" font-size="25" font-weight="700">Contact details lead</text>
    <text x="100" y="278" fill="#64748b" font-size="16">Icons stay subordinate to the sender.</text>

    <g transform="translate(100 326)">
      <circle cx="33" cy="33" r="33" fill="#0891b2"/>
      <path d="M18 33h30M33 18a24 24 0 0 1 0 30M33 18a24 24 0 0 0 0 30" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
      <circle cx="123" cy="33" r="33" fill="#0891b2"/>
      <rect x="104" y="14" width="38" height="38" rx="10" fill="none" stroke="#fff" stroke-width="4"/>
      <circle cx="123" cy="33" r="9" fill="none" stroke="#fff" stroke-width="4"/>
      <circle cx="136" cy="20" r="3" fill="#fff"/>
      <circle cx="213" cy="33" r="33" fill="#0891b2"/>
      <text x="213" y="46" text-anchor="middle" fill="#fff" font-size="39" font-weight="700">in</text>
      <path d="M66 82v34M0 82v34M0 105h66" fill="none" stroke="#0891b2" stroke-width="2"/>
      <path d="M156 82v34M90 82v34M90 105h66" fill="none" stroke="#0891b2" stroke-width="2"/>
      <path d="M246 82v34M180 82v34M180 105h66" fill="none" stroke="#0891b2" stroke-width="2"/>
      <text x="33" y="137" text-anchor="middle" fill="#164e63" font-size="17" font-weight="700">22px</text>
      <text x="123" y="137" text-anchor="middle" fill="#164e63" font-size="17" font-weight="700">22px</text>
      <text x="213" y="137" text-anchor="middle" fill="#164e63" font-size="17" font-weight="700">22px</text>
      <text x="78" y="28" text-anchor="middle" fill="#475569" font-size="13">8px</text>
      <text x="168" y="28" text-anchor="middle" fill="#475569" font-size="13">8px</text>
    </g>

    <rect x="660" y="180" width="148" height="30" rx="15" fill="#dcfce7"/>
    <text x="734" y="201" text-anchor="middle" fill="#166534" font-size="14" font-weight="700">SOCIAL-FIRST</text>
    <text x="660" y="247" fill="#164e63" font-size="25" font-weight="700">Profiles are primary</text>
    <text x="660" y="278" fill="#64748b" font-size="16">Larger icons suit creator-led layouts.</text>

    <g transform="translate(660 302)">
      <circle cx="45" cy="45" r="45" fill="#0891b2"/>
      <path d="M24 45h42M45 24a32 32 0 0 1 0 42M45 24a32 32 0 0 0 0 42" fill="none" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <circle cx="165" cy="45" r="45" fill="#0891b2"/>
      <rect x="139" y="19" width="52" height="52" rx="14" fill="none" stroke="#fff" stroke-width="5"/>
      <circle cx="165" cy="45" r="12" fill="none" stroke="#fff" stroke-width="5"/>
      <circle cx="182" cy="28" r="4" fill="#fff"/>
      <circle cx="285" cy="45" r="45" fill="#0891b2"/>
      <text x="285" y="62" text-anchor="middle" fill="#fff" font-size="52" font-weight="700">in</text>
      <path d="M90 107v34M0 107v34M0 130h90" fill="none" stroke="#0891b2" stroke-width="2"/>
      <path d="M210 107v34M120 107v34M120 130h90" fill="none" stroke="#0891b2" stroke-width="2"/>
      <path d="M330 107v34M240 107v34M240 130h90" fill="none" stroke="#0891b2" stroke-width="2"/>
      <text x="45" y="162" text-anchor="middle" fill="#164e63" font-size="17" font-weight="700">30px</text>
      <text x="165" y="162" text-anchor="middle" fill="#164e63" font-size="17" font-weight="700">30px</text>
      <text x="285" y="162" text-anchor="middle" fill="#164e63" font-size="17" font-weight="700">30px</text>
      <text x="105" y="40" text-anchor="middle" fill="#475569" font-size="13">10px</text>
      <text x="225" y="40" text-anchor="middle" fill="#475569" font-size="13">10px</text>
    </g>
  </g>
</svg>
