<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0f172a"/>

  <!-- Subtle grid pattern -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#1e293b" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="30%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#4F46E5" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Icon background circle -->
  <circle cx="220" cy="315" r="110" fill="#4F46E5" opacity="0.15"/>
  <circle cx="220" cy="315" r="88" fill="#4F46E5" opacity="0.2"/>

  <!-- Envelope icon (scaled up from favicon, centred at 220,315) -->
  <g transform="translate(220,315)">
    <!-- Envelope body -->
    <rect x="-58" y="-38" width="116" height="76" rx="8" fill="none" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Envelope flap -->
    <polyline points="-58,-38 0,14 58,-38" fill="none" stroke="#4F46E5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Right side: text content -->
  <!-- Product name -->
  <text x="380" y="248" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">Email Signature</text>
  <text x="380" y="314" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="52" font-weight="700" fill="#4F46E5" letter-spacing="-1">Generator</text>

  <!-- Divider line -->
  <rect x="380" y="336" width="440" height="2" rx="1" fill="#1e293b"/>

  <!-- Value prop -->
  <text x="380" y="380" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="26" fill="#94a3b8" letter-spacing="0">18 templates · Full customisation · No subscription</text>

  <!-- Price badge -->
  <rect x="380" y="412" width="188" height="52" rx="10" fill="#4F46E5"/>
  <text x="474" y="445" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="22" font-weight="700" fill="#ffffff" text-anchor="middle">$5 one-time</text>

  <!-- Domain -->
  <text x="380" y="540" font-family="system-ui, -apple-system, Arial, sans-serif" font-size="20" fill="#475569" letter-spacing="0.5">emailsignaturegenerator.ai</text>
</svg>
