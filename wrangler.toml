name = "emailsignaturegenerator"
main = "_worker.js"
compatibility_date = "2025-04-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[vars]
STRIPE_LIVEMODE = "true"
STRIPE_PAYMENT_LINK_ID = "plink_1TyARMBjqL7zQu5V2oL0hWyd"
STRIPE_TEAM_PAYMENT_LINK_ID = "plink_1UPJOvBjqL7zQu5VQtr3E85s"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "email-sig-photos"

[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1001"

[ratelimits.simple]
limit = 25
period = 60

# Workers Logs keeps the Worker's own console output and uncaught exceptions,
# so error alerts have something to read. Those lines carry error codes and
# route names only, never secrets or ids.
#
# Invocation logs are off: Cloudflare would otherwise record every request's
# method and full URL, and some URLs carry capabilities (the Stripe return
# /api/verify-payment?session_id=..., saved signatures /generator?s=...).
[observability]
enabled = true

[observability.logs]
invocation_logs = false
