name = "emailsignaturegenerator"
main = "_worker.js"
compatibility_date = "2025-04-01"

[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

[vars]
STRIPE_LIVEMODE = "true"
STRIPE_PAYMENT_LINK_ID = "plink_1TyARMBjqL7zQu5V2oL0hWyd"

[[r2_buckets]]
binding = "UPLOADS"
bucket_name = "email-sig-photos"

[[ratelimits]]
name = "RATE_LIMIT"
namespace_id = "1001"

[ratelimits.simple]
limit = 25
period = 60

# Workers Logs: keeps console output and uncaught exceptions so error alerts
# have something to read. Logs carry error codes only, never secrets or ids.
[observability]
enabled = true
